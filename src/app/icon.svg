<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="fotami-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="sheet-grad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <filter id="shadow" x="0" y="2" width="64" height="62" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#064e3b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base App Icon -->
  <rect width="64" height="64" rx="16" fill="url(#fotami-grad)" />

  <!-- Sheet paper with shadow -->
  <g filter="url(#shadow)">
    <rect x="14" y="11" width="36" height="42" rx="6" fill="url(#sheet-grad)" />
    <!-- Header bar -->
    <rect x="14" y="11" width="36" height="9" rx="6" fill="#10b981" />
    <rect x="14" y="17" width="36" height="3" fill="#10b981" />
    
    <!-- Table grid lines -->
    <line x1="20" y1="26" x2="44" y2="26" stroke="#059669" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="20" y1="33" x2="44" y2="33" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="20" y1="40" x2="44" y2="40" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="20" y1="47" x2="35" y2="47" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="29" y1="22" x2="29" y2="49" stroke="#e2e8f0" stroke-width="1.5" />
  </g>

  <!-- Accent Checkmark Badge -->
  <circle cx="45" cy="45" r="9.5" fill="#047857" stroke="#ffffff" stroke-width="2.5" />
  <path d="M41.5 45l2.5 2.5 4.5 -4.5" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
